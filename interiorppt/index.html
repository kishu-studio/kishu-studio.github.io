<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="img/logo.png">
<title>Ritz Design Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#233B53;--gold:#B29D7C;--ground:#FFFFFF;--soft:#F5F3EF;--line:#E2DED7;--mute:#6E7682;
  --deep:#13202E;--bar:64px;--pad:clamp(16px,3.4vw,48px);
  --ease:cubic-bezier(.77,0,.18,1);--out:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ground);color:var(--ink)}
body{font-family:'Archivo',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
img{display:block;max-width:100%}

.screen{position:fixed;inset:0;visibility:hidden;opacity:0}
.screen.active{visibility:visible;opacity:1;z-index:2}
.screen:not(.active),.screen:not(.active) *{visibility:hidden!important;pointer-events:none!important}

/* masked rise */
.m{display:block;overflow:hidden}
.m>span{display:block;transform:translateY(110%);transition:transform .9s var(--out);transition-delay:calc(var(--d,0) * 70ms + 120ms)}
.on .m>span,.active.on .m>span{transform:none}
.rv{clip-path:inset(100% 0 0 0);transition:clip-path 1.1s var(--ease);transition-delay:calc(var(--d,0) * 70ms + 100ms)}
.rv img{transform:scale(1.12);transition:transform 1.6s var(--out);transition-delay:calc(var(--d,0) * 70ms + 100ms)}
.on .rv{clip-path:inset(0 0 0 0)}
.on .rv img{transform:scale(1)}
.rule{height:1px;background:var(--line);transform:scaleX(0);transform-origin:left;transition:transform 1s var(--ease);transition-delay:calc(var(--d,0) * 70ms + 100ms)}
.on .rule{transform:scaleX(1)}

.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--mute)}

/* ---------- intro ---------- */
#intro{display:grid;place-items:center;text-align:center;cursor:pointer}
#intro .wrap{display:flex;flex-direction:column;align-items:center;gap:40px}
#intro .logo{width:min(380px,64vw);opacity:0;transform:translateY(16px);transition:opacity 1.2s var(--out) .2s,transform 1.4s var(--out) .2s}
#intro.on .logo{opacity:1;transform:none}
#intro .gl{width:min(380px,64vw);height:1px;background:var(--gold);transform:scaleX(0);transition:transform 1.2s var(--ease) .9s}
#intro.on .gl{transform:scaleX(1)}
#enter{display:inline-flex;align-items:center;gap:14px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;padding:14px 4px;opacity:0;transition:opacity .8s 1.5s}
#intro.on #enter{opacity:1}
#enter .ar{display:inline-block;width:36px;height:1px;background:currentColor;position:relative;transition:width .4s var(--out)}
#enter .ar::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
#enter:hover .ar{width:56px}
#intro .grid-lines{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);pointer-events:none}
#intro .grid-lines i{border-left:1px solid var(--line);transform:scaleY(0);transform-origin:top;transition:transform 1.4s var(--ease)}
#intro .grid-lines i:first-child{border-left:0}
#intro.on .grid-lines i{transform:scaleY(1)}
#intro.on .grid-lines i:nth-child(2){transition-delay:.1s}
#intro.on .grid-lines i:nth-child(3){transition-delay:.2s}
#intro.on .grid-lines i:nth-child(4){transition-delay:.3s}
#intro .wrap{position:relative;background:var(--ground);padding:48px 32px}

/* ---------- types ---------- */
#types{display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px var(--pad);border-bottom:1px solid var(--line);flex:none}
.top .home{display:flex;align-items:center}
.top .home img{height:38px;width:auto}
.top .count{font-size:12px;letter-spacing:.16em;color:var(--mute)}
.panels{flex:1;display:flex;min-height:0}
.panel{flex:1 1 0;min-width:0;display:flex;flex-direction:column;text-align:left;border-left:1px solid var(--line);transition:flex-grow .8s var(--ease);position:relative;overflow:hidden}
.panel:first-child{border-left:0}
.panel .head{padding:28px var(--pad) 24px clamp(16px,2vw,28px);display:flex;flex-direction:column;gap:12px;flex:none}
.panel .num{font-size:clamp(40px,4.6vw,72px);font-weight:300;line-height:.9;letter-spacing:-.04em;color:var(--gold)}
.panel .name{font-size:clamp(18px,1.7vw,26px);font-weight:600;letter-spacing:-.01em;line-height:1.1}
.panel .tags{font-size:12px;letter-spacing:.06em;color:var(--mute);line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel .pic{flex:1;min-height:0;position:relative;overflow:hidden}
.panel .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.8);transition:transform 1.4s var(--out),filter .8s}
.panel .go{position:absolute;left:clamp(16px,2vw,28px);bottom:22px;display:flex;align-items:center;gap:12px;color:#fff;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .6s var(--out);text-shadow:0 1px 12px rgba(0,0,0,.35)}
.panel .go i{display:inline-block;width:28px;height:1px;background:#fff}
.panel .bar{position:absolute;left:0;top:0;height:3px;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease)}
@media (hover:hover){
  .panels:hover .panel{flex-grow:.8}
  .panels .panel:hover{flex-grow:1.7}
  .panel:hover .pic img{transform:scale(1.04);filter:saturate(1)}
  .panel:hover .go{opacity:1;transform:none}
  .panel:hover .bar{transform:scaleX(1)}
}
.panel:focus-visible{outline-offset:-4px}
#types .panel .head,#types .panel .pic{opacity:0;transform:translateY(24px);transition:opacity .9s var(--out),transform 1s var(--out)}
#types.on .panel .head,#types.on .panel .pic{opacity:1;transform:none}
#types.on .panel:nth-child(1) .head{transition-delay:.15s}#types.on .panel:nth-child(1) .pic{transition-delay:.25s}
#types.on .panel:nth-child(2) .head{transition-delay:.23s}#types.on .panel:nth-child(2) .pic{transition-delay:.33s}
#types.on .panel:nth-child(3) .head{transition-delay:.31s}#types.on .panel:nth-child(3) .pic{transition-delay:.41s}
#types.on .panel:nth-child(4) .head{transition-delay:.39s}#types.on .panel:nth-child(4) .pic{transition-delay:.49s}

/* ---------- type view ---------- */
#view{display:flex;flex-direction:column}
#view .stage{flex:1;position:relative;min-height:0}
.ch{position:absolute;inset:0;padding:var(--pad);padding-bottom:calc(var(--pad) * .8);visibility:hidden;opacity:0;transition:opacity .5s,visibility 0s .5s;overflow:auto;-webkit-overflow-scrolling:touch}
.ch.on{visibility:visible;opacity:1;transition:opacity .3s,visibility 0s}
.ch .in{transition:transform .9s var(--out)}
.ch.from-r .in{transform:translateX(4vw)}
.ch.from-l .in{transform:translateX(-4vw)}
.ch.on .in{transform:none}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(12px,1.8vw,28px);height:100%}

/* statement */
.st .txt{grid-column:1/6;display:flex;flex-direction:column;justify-content:space-between;min-height:0;gap:32px;padding-top:4px}
.st .num{font-size:clamp(64px,9vw,148px);font-weight:300;line-height:.8;letter-spacing:-.05em;color:var(--gold)}
.st h1{font-size:clamp(40px,5.6vw,96px);font-weight:600;line-height:.95;letter-spacing:-.035em}
.st .tags{display:flex;flex-direction:column;margin-top:28px}
.st .tags .m{border-top:1px solid var(--line)}
.st .tags .m:last-child{border-bottom:1px solid var(--line)}
.st .tags span{padding:10px 0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.st p.desc{font-size:clamp(16px,1.25vw,19px);line-height:1.55;max-width:46ch;color:#3A4C5F}
.st .hero{grid-column:7/13;position:relative;min-height:0;height:100%}
.st .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* brief */
.br .rows{grid-column:1/9;display:flex;flex-direction:column;justify-content:center;min-height:0}
.br .hd{display:flex;align-items:baseline;gap:20px;margin-bottom:clamp(20px,3vh,40px)}
.br .hd .n{font-size:clamp(28px,2.6vw,40px);font-weight:300;color:var(--gold);letter-spacing:-.03em}
.br .hd .t{font-size:clamp(28px,2.6vw,40px);font-weight:600;letter-spacing:-.025em}
.row{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,5fr);column-gap:clamp(12px,1.8vw,28px);padding:clamp(14px,2.2vh,24px) 0}
.row .k{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--gold);padding-top:4px}
.row .v{font-size:clamp(16px,1.4vw,21px);line-height:1.45;font-weight:400}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.sw .s{display:flex;flex-direction:column;gap:6px;width:clamp(56px,5vw,76px)}
.sw .c{height:clamp(40px,5vh,56px);border:1px solid rgba(35,59,83,.12);transform:scaleY(0);transform-origin:bottom;transition:transform .8s var(--ease);transition-delay:calc(var(--d,0) * 60ms + 400ms)}
.on .sw .c{transform:none}
.sw .l{font-size:10.5px;letter-spacing:.04em;color:var(--mute);line-height:1.25}
.br .side{grid-column:10/13;position:relative;min-height:0}
.br .side img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* gallery */
.gal{columns:3;column-gap:clamp(10px,1.4vw,20px)}
.gal button{display:block;width:100%;margin-bottom:clamp(10px,1.4vw,20px);break-inside:avoid;overflow:hidden;position:relative}
.gal button img{width:100%;height:auto;transition:transform 1.2s var(--out)}
.gal button::after{content:"";position:absolute;inset:0;border:0 solid var(--ground);transition:border-width .4s var(--out)}
@media (hover:hover){.gal button:hover img{transform:scale(1.03)}}
.gal .rv{clip-path:inset(0 0 100% 0)}
.on .gal .rv{clip-path:inset(0 0 0 0)}
.galhd{display:flex;align-items:baseline;gap:20px;margin-bottom:clamp(16px,2.4vh,28px)}
.galhd .n{font-size:clamp(28px,2.6vw,40px);font-weight:300;color:var(--gold);letter-spacing:-.03em}
.galhd .t{font-size:clamp(28px,2.6vw,40px);font-weight:600;letter-spacing:-.025em}
.mat{columns:3}

/* ---------- bottom bar ---------- */
#bbar{position:relative;height:var(--bar);flex:none;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 var(--pad);background:var(--ground)}
#prog{position:absolute;left:0;top:-1px;height:2px;background:var(--ink);transition:width .7s var(--ease)}
#back{display:inline-flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;justify-self:start;padding:10px 0}
#back .ar{width:24px;height:1px;background:currentColor;position:relative;transition:width .35s var(--out)}
#back .ar::before{content:"";position:absolute;left:0;top:-3px;width:7px;height:7px;border-left:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg)}
#back:hover .ar{width:40px}
#tsw{display:flex;gap:2px}
#tsw button{font-size:13px;font-weight:500;padding:10px 12px;color:var(--mute);position:relative;transition:color .3s}
#tsw button::after{content:"";position:absolute;left:12px;right:12px;bottom:4px;height:2px;background:var(--gold);transform:scaleX(0);transition:transform .5s var(--ease)}
#tsw button[aria-current="true"]{color:var(--ink)}
#tsw button[aria-current="true"]::after{transform:scaleX(1)}
#tsw button:hover{color:var(--ink)}
#chnav{justify-self:end;display:flex;align-items:center;gap:14px}
#chlab{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;display:flex;gap:10px;align-items:baseline}
#chlab b{font-weight:600;color:var(--ink)}
#chlab em{font-style:normal;color:var(--mute)}
.nb{width:40px;height:40px;border:1px solid var(--line);display:grid;place-items:center;transition:background .3s,border-color .3s,color .3s}
.nb:hover:not(:disabled){background:var(--ink);border-color:var(--ink);color:#fff}
.nb:disabled{opacity:.3;cursor:default}
.nb svg{width:14px;height:14px}

/* ---------- wipe ---------- */
#wipe{position:fixed;inset:0;background:var(--ink);z-index:50;transform:scaleY(0);transform-origin:bottom;pointer-events:none;display:grid;place-items:center}
#wipe.cover{transform:scaleY(1);transition:transform .55s var(--ease)}
#wipe.leave{transform:scaleY(0);transform-origin:top;transition:transform .6s var(--ease)}
#wipe span{color:var(--gold);font-size:clamp(64px,10vw,160px);font-weight:300;letter-spacing:-.05em;opacity:0;transition:opacity .25s}
#wipe.cover span{opacity:1;transition-delay:.25s}

/* ---------- lightbox ---------- */
#lb{position:fixed;inset:0;z-index:60;background:var(--deep);display:grid;grid-template-rows:auto 1fr;visibility:hidden;opacity:0;transition:opacity .4s,visibility 0s .4s;color:#fff}
#lb.open{visibility:visible;opacity:1;transition:opacity .4s}
#lb .lbt{display:flex;justify-content:space-between;align-items:center;padding:14px var(--pad);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
#lb .lbt button{width:40px;height:40px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.25)}
#lb .lbt button:hover{background:#fff;color:var(--deep)}
#lb figure{position:relative;min-height:0;display:grid;place-items:center;padding:0 72px 32px}
#lb img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity .3s,transform .5s var(--out)}
#lb img.swap{opacity:0;transform:scale(.98)}
#lb .lp,#lb .ln{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center}
#lb .lp{left:16px}#lb .ln{right:16px}
#lb .lp:hover,#lb .ln:hover{background:#fff;color:var(--deep)}
#lb svg{width:16px;height:16px}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .st .txt{grid-column:1/13;order:2}
  .st .hero{grid-column:1/13;height:42vh;order:1;margin-bottom:24px}
  .st.g,.br.g{height:auto;grid-auto-rows:auto}
  .st .num{display:none}
  .br .rows{grid-column:1/13}
  .br .side{display:none}
  .gal{columns:2}
}
@media (max-width:760px){
  :root{--bar:58px}
  .panels{flex-direction:column}
  .panel{flex-direction:row;border-left:0;border-top:1px solid var(--line)}
  .panel:first-child{border-top:0}
  .panel .head{width:52%;padding:16px;justify-content:center;gap:6px}
  .panel .tags{white-space:normal}
  .panel .pic{flex:1}
  .panel .go{display:none}
  .row{grid-template-columns:1fr;row-gap:6px}
  #chlab{display:none}
  #tsw button{padding:10px 7px}
  #tsw button::after{left:7px;right:7px}
  #back .t{display:none}
  .nb{width:36px;height:36px}
  #lb figure{padding:0 8px 72px}
  #lb .lp,#lb .ln{top:auto;bottom:12px;transform:none}
  .top .home img{height:30px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;transition-delay:0ms!important;animation:none!important}
}
</style>
</head>
<body>

<section id="intro" class="screen" aria-label="Ritz Design Studio">
  <div class="grid-lines" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="wrap">
    <img class="logo" src="img/logo.png" alt="Ritz Design Studio">
    <div class="gl"></div>
    <button id="enter">Enter <span class="ar"></span></button>
  </div>
</section>

<section id="types" class="screen" aria-label="Design types">
  <div class="top">
    <button class="home" id="toIntro" aria-label="Back to start"><img src="img/logo.png" alt="Ritz Design Studio"></button>
    <span class="count">01 — 04</span>
  </div>
  <div class="panels" id="panels"></div>
</section>

<section id="view" class="screen" aria-label="Design type">
  <div class="stage" id="stage"></div>
  <nav id="bbar" aria-label="Presentation">
    <div id="prog"></div>
    <button id="back"><span class="ar"></span><span class="t">All types</span></button>
    <div id="tsw" role="group" aria-label="Switch type"></div>
    <div id="chnav">
      <span id="chlab"></span>
      <button class="nb" id="prev" aria-label="Previous"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 3 5 8l5 5"/></svg></button>
      <button class="nb" id="next" aria-label="Next"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m6 3 5 5-5 5"/></svg></button>
    </div>
  </nav>
</section>

<div id="wipe" aria-hidden="true"><span id="wipen"></span></div>

<div id="lb" role="dialog" aria-modal="true" aria-label="Photo">
  <div class="lbt"><span id="lbc"></span><button id="lbx" aria-label="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 3l10 10M13 3 3 13"/></svg></button></div>
  <figure>
    <img id="lbi" alt="">
    <button class="lp" id="lbp" aria-label="Previous photo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 3 5 8l5 5"/></svg></button>
    <button class="ln" id="lbn" aria-label="Next photo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m6 3 5 5-5 5"/></svg></button>
  </figure>
</div>

<script>
const T=[
 {name:'Affordable & Functional',short:'Affordable',tags:['Smart Design','Practical Choices','Budget-Friendly'],
  desc:'A thoughtfully designed interior that focuses on functionality, durability, and cost-effective material selection. The design maintains a clean and attractive appearance while making the best use of the available budget.',
  rows:[['Design Approach','Simple furniture, practical storage solutions, standard finishes, and efficient space planning.'],
        ['Colour Palette','Soft beige, white, light grey, and subtle wood tones.'],
        ['Materials & Finishes','Laminate finishes, simple lighting fixtures, and budget-friendly fabrics.'],
        ['Overall Feel','Practical, comfortable, neat, and value-driven.']],
  sw:[['Soft beige','#E6D8C3'],['White','#FBFAF6'],['Light grey','#D3D1CC'],['Subtle wood','#B08A63']],
  hero:4,side:2,imgs:6,mats:4},
 {name:'Minimalist',short:'Minimalist',tags:['Less Is More','Clean Lines','Timeless Simplicity'],
  desc:'A refined design approach that emphasises simplicity, openness, and visual balance. Every element serves a purpose, creating a clutter-free environment with clean lines, subtle textures, and carefully selected furnishings.',
  rows:[['Design Approach','Streamlined furniture, concealed storage, minimal detailing, and open visual spaces.'],
        ['Colour Palette','White, ivory, beige, greige, and muted natural tones.'],
        ['Materials & Finishes','Matte laminates, subtle wood textures, natural stone, glass, and understated metal accents.'],
        ['Overall Feel','Calm, spacious, elegant, and effortlessly modern.']],
  sw:[['White','#FBFAF6'],['Ivory','#F1EADB'],['Beige','#DCCDB6'],['Greige','#B9B1A5'],['Muted natural','#9A8B76']],
  hero:3,side:6,imgs:6,mats:6},
 {name:'Classical',short:'Classical',tags:['Timeless Elegance','Rich Detailing','Sophisticated Interiors'],
  desc:'Inspired by traditional European design, classical interiors celebrate symmetry, refined craftsmanship, decorative detailing, and elegant proportions. The style creates a graceful and sophisticated atmosphere through balanced compositions and timeless design elements.',
  rows:[['Design Approach','Decorative wall mouldings, symmetrical furniture arrangements, elegant profiles, and statement lighting.'],
        ['Colour Palette','Cream, ivory, taupe, warm beige, and muted deeper accents.'],
        ['Materials & Finishes','Moulded wall panels, polished stone, premium wood finishes, upholstered furniture, and refined metal accents.'],
        ['Overall Feel','Graceful, luxurious, traditional, and timeless.']],
  sw:[['Cream','#F2E6CF'],['Ivory','#F4EEE2'],['Taupe','#A39282'],['Warm beige','#D6BF9E'],['Deeper accent','#5B4636']],
  hero:7,side:4,imgs:7,mats:5},
 {name:'Luxury',short:'Luxury',tags:['Premium Materials','Bespoke Detailing','Refined Living'],
  desc:'A sophisticated design approach that combines premium materials, customised furniture, layered lighting, and carefully curated details. The focus is on creating an exclusive interior where every element contributes to comfort, visual richness, and a seamless overall experience.',
  rows:[['Design Approach','Custom-designed furniture, statement feature walls, integrated lighting, refined detailing, and coordinated material combinations.'],
        ['Colour Palette','Ivory, champagne beige, taupe, greige, and selected dark or metallic accents.'],
        ['Materials & Finishes','Premium veneer, PU finishes, marble or stone surfaces, fluted glass, textured wall finishes, and high-quality fabrics.'],
        ['Overall Feel','Exclusive, elegant, sophisticated, and exceptionally detailed.']],
  sw:[['Ivory','#F5F0E6'],['Champagne beige','#E3D2B4'],['Taupe','#A39282'],['Greige','#B9B1A5'],['Dark accent','#2A2622'],['Metallic','#B08D57']],
  hero:1,side:2,imgs:7,mats:4}
];
const pad=n=>String(n).padStart(2,'0');
const img=(t,i)=>`img/t${t}-${i}.jpg`;
const chapters=t=>{const c=['Overview','Brief','Spaces'];if(T[t-1].mats)c.push('Materials');return c};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* types panels */
$('#panels').innerHTML=T.map((t,i)=>`
 <button class="panel" data-t="${i+1}" aria-label="${pad(i+1)} ${esc(t.name)}">
  <span class="bar"></span>
  <span class="head"><span class="num">${pad(i+1)}</span><span class="name">${esc(t.name)}</span><span class="tags">${t.tags.join(' · ')}</span></span>
  <span class="pic"><img src="${img(i+1,t.hero)}" alt="" loading="eager"><span class="go"><i></i>Open</span></span>
 </button>`).join('');
document.querySelectorAll('.panel').forEach(p=>p.addEventListener('click',()=>go({s:'view',t:+p.dataset.t,c:0})));
$('#tsw').innerHTML=T.map((t,i)=>`<button data-t="${i+1}" aria-label="${esc(t.name)}">${pad(i+1)}</button>`).join('');
document.querySelectorAll('#tsw button').forEach(b=>b.addEventListener('click',()=>{if(+b.dataset.t!==state.t)go({s:'view',t:+b.dataset.t,c:0})}));

/* chapter builders */
function m(text,d){return `<span class="m" style="--d:${d}"><span>${text}</span></span>`}
function buildType(n){
 const t=T[n-1];let d=0;
 const st=`<div class="ch" data-c="0"><div class="in g st">
   <div class="txt">
     <div>${m(`<span class="num">${pad(n)}</span>`,d++)}</div>
     <div>
       <h1>${t.name.split(' ').map(w=>m(esc(w),d++)).join('')}</h1>
       <div class="tags">${t.tags.map(x=>m(esc(x),d++)).join('')}</div>
     </div>
     ${m(`<p class="desc">${esc(t.desc)}</p>`,d++)}
   </div>
   <button class="hero rv" style="--d:1" data-lb="${n}:${t.hero}" aria-label="Open photo"><img src="${img(n,t.hero)}" alt=""></button>
 </div></div>`;
 d=0;
 const br=`<div class="ch" data-c="1"><div class="in g br">
   <div class="rows">
     <div class="hd">${m(`<span class="n">${pad(n)}</span>`,d++)}${m(`<span class="t">${esc(t.name)}</span>`,d++)}</div>
     ${t.rows.map((r,i)=>`<div class="rule" style="--d:${d}"></div><div class="row"><div class="k">${m(esc(r[0]),d)}</div><div class="v">${m(esc(r[1]),d++)}
       ${i===1?`<div class="sw">${t.sw.map((s,j)=>`<div class="s"><div class="c" style="background:${s[1]};--d:${j}"></div><span class="l">${esc(s[0])}</span></div>`).join('')}</div>`:''}</div></div>`).join('')}
     <div class="rule" style="--d:${d}"></div>
   </div>
   <button class="side rv" style="--d:2" data-lb="${n}:${t.side}" aria-label="Open photo"><img src="${img(n,t.side)}" alt=""></button>
 </div></div>`;
 const order=[t.hero,...Array.from({length:t.imgs},(_,i)=>i+1).filter(i=>i!==t.hero)];
 const ga=`<div class="ch" data-c="2"><div class="in">
   <div class="galhd">${m(`<span class="n">${pad(n)}</span>`,0)}${m(`<span class="t">${esc(t.short)}</span>`,1)}</div>
   <div class="gal">${order.map((i,k)=>`<button class="rv" style="--d:${k+1}" data-lb="${n}:${i}" aria-label="Open photo ${k+1}"><img src="${img(n,i)}" alt="" loading="lazy"></button>`).join('')}</div>
 </div></div>`;
 const ma=t.mats?`<div class="ch" data-c="3"><div class="in">
   <div class="galhd">${m(`<span class="n">${pad(n)}</span>`,0)}${m(`<span class="t">Materials</span>`,1)}</div>
   <div class="gal mat">${Array.from({length:t.mats},(_,i)=>`<button class="rv" style="--d:${i+1}" data-lb="m${n}:${i+1}" aria-label="Open material ${i+1}"><img src="img/m${n}-${i+1}.jpg" alt="" loading="lazy"></button>`).join('')}</div>
 </div></div>`:'';
 $('#stage').innerHTML=st+br+ga+ma;
 $('#stage').querySelectorAll('[data-lb]').forEach(b=>b.addEventListener('click',()=>openLB(b.dataset.lb)));
}

/* state + routing */
let state={s:null,t:0,c:0},busy=false,pending=null;
const same=(a,b)=>a.s===b.s&&(a.s!=='view'||(a.t===b.t&&a.c===b.c));
function screenEl(s){return $('#'+s)}
function setChapter(c,dir){
 const chs=[...document.querySelectorAll('#stage .ch')];
 chs.forEach((el,i)=>{
   el.classList.remove('from-l','from-r');
   if(i===c){el.classList.add(dir<0?'from-l':'from-r');el.scrollTop=0;
     el.classList.remove('on');void el.offsetWidth;el.classList.add('on');}
   else el.classList.remove('on');
 });
 const n=chs.length;
 $('#prog').style.width=((c+1)/n*100)+'%';
 $('#chlab').innerHTML=`<b>${pad(c+1)} / ${pad(n)}</b><em>${chapters(state.t)[c]}</em>`;
 $('#prev').disabled=c===0;
 $('#next').disabled=c===n-1 && state.t===4;
 $('#next').setAttribute('aria-label',c===n-1?'Next type':'Next');
}
function apply(ns,dir){
 ['intro','types','view'].forEach(s=>{const el=screenEl(s);el.classList.toggle('active',s===ns.s);if(s!==ns.s)el.classList.remove('on')});
 if(ns.s==='view'){
   if(ns.t!==state.t||state.s!=='view')buildType(ns.t);
   document.querySelectorAll('#tsw button').forEach(b=>b.setAttribute('aria-current',+b.dataset.t===ns.t?'true':'false'));
 }
 const prev=state;state={...ns};
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
   screenEl(ns.s).classList.add('on');
   if(ns.s==='view')setChapter(ns.c,dir||1);
 }));
 const h=ns.s==='intro'?'':ns.s==='types'?'#types':`#t${ns.t}-${ns.c+1}`;
 try{history.replaceState(null,'',h||location.pathname+location.search)}catch(e){}
}
function go(ns,dir){
 if(busy){pending=[ns,dir];return}
 // chapter change inside the same type: no wipe
 if(ns.s==='view'&&state.s==='view'&&ns.t===state.t){state.c=ns.c;setChapter(ns.c,dir);
   try{history.replaceState(null,'',`#t${ns.t}-${ns.c+1}`)}catch(e){}return}
 if(reduce||state.s===null){apply(ns,dir);return}
 busy=true;
 const w=$('#wipe');$('#wipen').textContent=ns.s==='view'?pad(ns.t):'';
 w.className='';void w.offsetWidth;w.classList.add('cover');
 setTimeout(()=>{apply(ns,dir);w.classList.remove('cover');void w.offsetWidth;w.classList.add('leave');
   setTimeout(()=>{w.className='';busy=false;
     if(pending){const [p,d]=pending;pending=null;if(!same(p,state))go(p,d)}},620)},680);
}
function step(d){
 if(state.s!=='view')return;
 const n=chapters(state.t).length,c=state.c+d;
 if(c>=0&&c<n)go({s:'view',t:state.t,c},d);
 else if(c>=n&&state.t<4)go({s:'view',t:state.t+1,c:0},1);
 else if(c<0&&state.t>1)go({s:'view',t:state.t-1,c:chapters(state.t-1).length-1},-1);
}
$('#prev').onclick=()=>step(-1);
$('#next').onclick=()=>step(1);
$('#back').onclick=()=>go({s:'types'});
$('#toIntro').onclick=()=>go({s:'intro'});
$('#intro').addEventListener('click',()=>go({s:'types'}));

/* lightbox */
let lb={list:[],i:0};
function openLB(key){
 const [k,i]=key.split(':');const mat=k.startsWith('m');const t=+k.replace('m','');
 const tt=T[t-1];
 lb.list=mat?Array.from({length:tt.mats},(_,j)=>`img/m${t}-${j+1}.jpg`)
   :[tt.hero,...Array.from({length:tt.imgs},(_,j)=>j+1).filter(j=>j!==tt.hero)].map(j=>img(t,j));
 const src=mat?`img/m${t}-${i}.jpg`:img(t,+i);
 lb.i=Math.max(0,lb.list.indexOf(src));showLB();$('#lb').classList.add('open');$('#lbx').focus();
}
function showLB(){const im=$('#lbi');im.classList.add('swap');
 setTimeout(()=>{im.src=lb.list[lb.i];im.onload=()=>im.classList.remove('swap')},reduce?0:150);
 $('#lbc').textContent=`${pad(lb.i+1)} / ${pad(lb.list.length)}`}
function lbStep(d){lb.i=(lb.i+d+lb.list.length)%lb.list.length;showLB()}
function closeLB(){$('#lb').classList.remove('open')}
$('#lbx').onclick=closeLB;$('#lbp').onclick=()=>lbStep(-1);$('#lbn').onclick=()=>lbStep(1);
$('#lb figure').addEventListener('click',e=>{if(e.target.tagName==='FIGURE')closeLB()});

/* keyboard */
addEventListener('keydown',e=>{
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 if($('#lb').classList.contains('open')){
   if(e.key==='Escape')closeLB();else if(e.key==='ArrowRight')lbStep(1);else if(e.key==='ArrowLeft')lbStep(-1);return}
 if(state.s==='intro'&&(e.key==='Enter'||e.key===' '||e.key==='ArrowRight')){e.preventDefault();go({s:'types'});return}
 if(/^[1-4]$/.test(e.key)&&state.s!=='intro'){go({s:'view',t:+e.key,c:0});return}
 if(state.s==='view'){
   if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();step(1)}
   else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();step(-1)}
   else if(e.key==='Escape')go({s:'types'});
 }else if(state.s==='types'&&e.key==='Escape')go({s:'intro'});
});

/* swipe */
let tx=null,ty=0;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
 if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.4)return;
 if($('#lb').classList.contains('open'))lbStep(dx<0?1:-1);else if(state.s==='view')step(dx<0?1:-1)},{passive:true});

/* start */
(function(){
 const h=location.hash;let mt=h.match(/^#t([1-4])-(\d)$/);
 if(mt){const t=+mt[1];go({s:'view',t,c:Math.min(+mt[2]-1,chapters(t).length-1)})}
 else if(h==='#types')go({s:'types'});
 else go({s:'intro'});
 // warm the cache for hero images
 T.forEach((t,i)=>{const im=new Image();im.src=img(i+1,t.side)});
})();
</script>
</body>
</html>
